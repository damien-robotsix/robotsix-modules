name: Setup
description: 'Install uv and Python, and sync the project environment.'
inputs:
  python-version:
    description: 'Python version for uv to install and use.'
    required: true
    type: string
  sync-args:
    description: 'Arguments to pass to uv sync. Set to empty string to skip sync.'
    default: '--locked --group dev'
    type: string
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
    - if: ${{ inputs.sync-args != '' }}
      shell: bash
      env:
        UV_MALWARE_CHECK: "1"
      run: uv sync ${{ inputs.sync-args }}
