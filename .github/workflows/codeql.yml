name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
permissions: {}
jobs:
  analyze:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@d2a2353830cf211a9f18f3585085016766294dff  # main
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    with:
      languages: python
