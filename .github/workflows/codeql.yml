name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
permissions: {}
jobs:
  analyze:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@2d57525b51c301fef15576f9d1e962e1c0f18055  # main
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    with:
      languages: python
