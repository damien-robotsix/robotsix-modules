name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
permissions: {}
jobs:
  analyze:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@86dae89b637dad27ddba0aaa5f9430e083288365  # main
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    with:
      languages: python
      queries: security-extended
