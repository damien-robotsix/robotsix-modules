name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    permissions:
      contents: write  # needed for GitHub Release upload
      id-token: write  # needed for PyPI trusted publishing
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-release.yml@f6219bfc4b1d44b8d574a7ea022882a2edba1c6c
    with:
      github-release: true
