name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    permissions:
      contents: write  # needed for GitHub Release upload
      id-token: write  # needed for PyPI trusted publishing
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-release.yml@d2a2353830cf211a9f18f3585085016766294dff
    with:
      github-release: true
