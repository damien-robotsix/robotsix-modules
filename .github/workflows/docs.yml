name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    permissions:
      contents: read  # needed to checkout the repo
      pages: write  # needed to deploy to GitHub Pages
      id-token: write  # needed for OIDC to deploy to Pages
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@2d57525b51c301fef15576f9d1e962e1c0f18055  # main
