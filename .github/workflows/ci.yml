name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  check:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@7c73ae5fd1b3be90c97b25a6d6a0ebf129571237
    with:
      python-version: "3.14"
      cov-package: "robotsix_modules"
      coverage-threshold: "90"
      run-bandit: true
      mypy-advisory: false

  lowest-deps-test:
    name: Lowest compatible dependency test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync-args: "--resolution lowest-direct --group dev --group test"
      - run: uv run pytest

  lockfile-check:
    name: Lockfile check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync-args: ""
      - run: uv lock --check

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync-args: ""
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  vulture:
    name: Vulture dead code scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      - run: uv run vulture src/ vulture_whitelist.py

  changelog-fragment:
    name: Changelog fragment check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      - name: Validate fragment types
        run: |
          python -c "
          import tomllib, sys, re
          from pathlib import Path
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          types = {t['directory'] for t in d.get('tool', {}).get('towncrier', {}).get('type', [])}
          errors = []
          for p in Path('changelog.d').iterdir():
              if p.name == '.gitkeep' or p.is_dir():
                  continue
              # Match <timestamp>-<slug>.<type>.md
              m = re.match(r'.+?\.(\w+)\.md$', p.name)
              if m and m.group(1) not in types:
                  errors.append(f'{p.name}: unknown type \"{m.group(1)}\" (valid: {sorted(types)})')
          if errors:
              print('Fragment type validation failed:', file=sys.stderr)
              for e in errors:
                  print(f'  {e}', file=sys.stderr)
              sys.exit(1)
          print('All fragment types valid.')
          "

  zizmor:
    name: Zizmor workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      - run: uv run zizmor --format sarif . --output zizmor-results.sarif
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        if: always()
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync-args: ""
      - run: uv run --with gitleaks gitleaks detect --source . --verbose --no-git

  validate-pyproject:
    name: Validate pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      - run: uv run validate-pyproject

  mkdocs-build:
    name: MkDocs build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync-args: "--locked --group docs"
      - run: uv run mkdocs build --strict

  version-check:
    name: Version consistency check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      - name: Check version consistency
        run: |
          PYPROJECT=$(uv run python -c "from tomllib import load; print(load(open('pyproject.toml','rb'))['project']['version'])")
          CHANGELOG=$(grep -oP '^## \[\K[^\]]+' CHANGELOG.md | head -1)
          README_VER=$(grep -oP 'v\d+\.\d+\.\d+' README.md | head -3 | sort -u)
          SECURITY_VER=$(grep -oP '\*\*v\d+\.\d+\.\d+\*\*' SECURITY.md | grep -oP '\d+\.\d+\.\d+')
          if [ "$PYPROJECT" != "$CHANGELOG" ] || echo "$README_VER" | grep -qvF "$PYPROJECT" || [ "$PYPROJECT" != "$SECURITY_VER" ]; then
            echo "Version mismatch detected"
            echo "  pyproject.toml:   $PYPROJECT"
            echo "  CHANGELOG.md:     $CHANGELOG"
            echo "  README.md:        $README_VER"
            echo "  SECURITY.md:      $SECURITY_VER"
            exit 1
          fi

  check-registration:
    name: Check module registration
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      - run: uv run robotsix-modules check-registration docs/modules.yaml --root .

  schema-reference-sync:
    name: Schema-reference example sync check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
      - name: Check schema-reference example matches modules.yaml
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          import yaml

          # Read modules.yaml
          actual = yaml.safe_load(Path('docs/modules.yaml').read_text())

          # Extract the "Complete example" YAML block from schema-reference.md
          md_text = Path('docs/schema-reference.md').read_text()
          # Find all fenced YAML blocks; select the one containing 'package: robotsix_modules'
          blocks = list(re.finditer(r'\`\`\`yaml\n(.*?)\n\`\`\`', md_text, re.DOTALL))
          example_block = None
          for m in blocks:
              if 'package: robotsix_modules' in m.group(1):
                  example_block = m.group(1)
                  break
          if example_block is None:
              print('ERROR: could not find "Complete example" YAML block in docs/schema-reference.md', file=sys.stderr)
              sys.exit(1)
          example = yaml.safe_load(example_block)

          # Compare modules: match by id, compare paths and dependencies
          actual_by_id = {m['id']: m for m in actual['modules']}
          example_by_id = {m['id']: m for m in example['modules']}

          errors = []
          all_ids = sorted(set(actual_by_id) | set(example_by_id))
          for mid in all_ids:
              a = actual_by_id.get(mid)
              e = example_by_id.get(mid)
              if a is None:
                  errors.append(f'module {mid!r}: present in example but not in modules.yaml')
                  continue
              if e is None:
                  errors.append(f'module {mid!r}: present in modules.yaml but not in example')
                  continue
              # Compare paths (order-normalised)
              a_paths = sorted(a.get('paths', []))
              e_paths = sorted(e.get('paths', []))
              if a_paths != e_paths:
                  only_actual = sorted(set(a_paths) - set(e_paths))
                  only_example = sorted(set(e_paths) - set(a_paths))
                  details = []
                  if only_actual:
                      details.append(f'in modules.yaml but not in example: {only_actual}')
                  if only_example:
                      details.append(f'in example but not in modules.yaml: {only_example}')
                  errors.append(f'module {mid!r}: paths mismatch — ' + '; '.join(details))
              # Compare dependencies (order-normalised)
              a_deps = sorted(a.get('dependencies', []))
              e_deps = sorted(e.get('dependencies', []))
              if a_deps != e_deps:
                  only_actual = sorted(set(a_deps) - set(e_deps))
                  only_example = sorted(set(e_deps) - set(a_deps))
                  details = []
                  if only_actual:
                      details.append(f'in modules.yaml but not in example: {only_actual}')
                  if only_example:
                      details.append(f'in example but not in modules.yaml: {only_example}')
                  errors.append(f'module {mid!r}: dependencies mismatch — ' + '; '.join(details))

          if errors:
              print('Schema-reference example is out of sync with modules.yaml:', file=sys.stderr)
              for err in errors:
                  print(f'  {err}', file=sys.stderr)
              sys.exit(1)
          print('Schema-reference example matches modules.yaml.')
          "

  wheel-install:
    name: Wheel install smoketest
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync-args: ""
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel into a clean environment
        run: |
          uv venv --python 3.14 wheel-env
          uv pip install --python wheel-env \
            dist/*.whl
      - name: Smoke-test the installed wheel
        run: |
          ./wheel-env/bin/python -c "import robotsix_modules; print('import ok:', robotsix_modules.__version__)"
          ./wheel-env/bin/robotsix-modules --help
          ./wheel-env/bin/robotsix-modules validate \
            "$WORKSPACE/tests/cli/fixtures/valid_modules.yaml"
      - name: Dogfood — validate the real modules.yaml
        run: ./wheel-env/bin/robotsix-modules validate \
          "$WORKSPACE/docs/modules.yaml"

  sbom:
    name: SBOM + audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    needs: [check]
    if: always()
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"
          sync-args: "--locked"
      - run: uv audit --output-format sarif --output-file uv-audit.sarif
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        if: always()
        with:
          sarif_file: uv-audit.sarif
          category: uv-audit
      - run: uv export --format cyclonedx1.5 --output-file sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

  security:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@7c73ae5fd1b3be90c97b25a6d6a0ebf129571237
