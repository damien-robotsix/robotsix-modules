name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  check:
    permissions:
      contents: read
      security-events: write  # needed by bandit / audit SARIF uploads inside the reusable workflow
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@f6219bfc4b1d44b8d574a7ea022882a2edba1c6c
    with:
      python-version: "3.14"
      cov-package: "robotsix_modules"
      coverage-threshold: "90"
      run-bandit: true
      mypy-advisory: false

  lowest-deps-test:
    name: Lowest compatible dependency test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
          sync-args: "--resolution lowest-direct --group dev --group test"
      - run: uv run pytest

  lockfile-check:
    name: Lockfile check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
          sync-args: ""
      - run: uv lock --check

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write  # documented exception: shared workflow posts the PR summary comment
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@47523e8aa2d34d41da060d29b57f75ab262cb840  # v1.4.0
    with:
      fail-on-severity: moderate

  vulture:
    name: Vulture dead code scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
      - run: uv run vulture src/ vulture_whitelist.py

  zizmor:
    name: Zizmor workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
      # Collect only workflows/composite-actions/dependabot: zizmor cannot
      # parse the AGENT.md-mandated `repo: .` (rev: "") dogfood entry in
      # .pre-commit-config.yaml and aborts the whole audit ("no audit was
      # performed") when it is collected. Scoping keeps the full GitHub
      # Actions security audit intact.
      - run: uv run zizmor --collect=workflows,actions,dependabot --format sarif . > zizmor-results.sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        if: always()
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
          sync-args: ""
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"  # gitleaks v8.30.1 requires Go 1.24
      - name: Install gitleaks (integrity via Go checksum DB)
        # gitleaks v8.30.1's go.mod declares module github.com/zricethezav/gitleaks/v8,
        # so Go rejects the github.com/gitleaks/gitleaks/v8 import path.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Gitleaks secrets scan
        run: '"$(go env GOPATH)/bin/gitleaks" detect --source . --verbose --no-git'

  validate-pyproject:
    name: Validate pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
      - run: uv run validate-pyproject

  doc-examples:
    name: Documentation examples
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
      - name: Test documentation examples
        run: uv run pytest tests/test_examples.py

  mkdocs-build:
    name: MkDocs build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
          sync-args: "--locked --group docs"
      - run: uv run mkdocs build --strict

  version-check:
    name: Version consistency check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
      - name: Check version consistency
        run: |
          PYPROJECT=$(uv run python -c "from tomllib import load; print(load(open('pyproject.toml','rb'))['project']['version'])")
          CHANGELOG=$(grep -oP '^## \[\K[^\]]+' CHANGELOG.md | head -1)
          README_VER=$(grep -oP 'v\d+\.\d+\.\d+' README.md | head -3 | sort -u)
          SECURITY_VER=$(grep -oP '\*\*v\d+\.\d+\.\d+\*\*' SECURITY.md | grep -oP '\d+\.\d+\.\d+')
          if [ "$PYPROJECT" != "$CHANGELOG" ] || echo "$README_VER" | grep -qvF "$PYPROJECT" || [ "$PYPROJECT" != "$SECURITY_VER" ]; then
            echo "Version mismatch detected"
            echo "  pyproject.toml:   $PYPROJECT"
            echo "  CHANGELOG.md:     $CHANGELOG"
            echo "  README.md:        $README_VER"
            echo "  SECURITY.md:      $SECURITY_VER"
            exit 1
          fi

  check-registration:
    name: Check module registration
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
      - run: uv run robotsix-modules check-registration docs/modules.yaml --root .

  schema-reference-sync:
    name: Schema-reference example sync check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
      - name: Check schema-reference example matches modules.yaml
        # Shared with scripts/check so local and CI run the same comparison.
        run: uv run python scripts/check_schema_reference_sync.py

  wheel-install:
    name: Wheel install smoketest
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
          sync-args: ""
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel into a clean environment
        run: |
          uv venv --python 3.14 wheel-env
          uv pip install --python wheel-env \
            dist/*.whl
      - name: Smoke-test the installed wheel
        run: |
          ./wheel-env/bin/python -c "import robotsix_modules; print('import ok:', robotsix_modules.__version__)"
          ./wheel-env/bin/robotsix-modules --help
          # --root at an empty *git* repo scopes the path-coverage check away
          # from the repo working tree: git ls-files reports no tracked files,
          # so the fixture's claimed paths are the only coverage surface. A
          # plain (non-git) temp dir would now raise GitOperationError.
          coverage_root="$(mktemp -d)"
          git init -q "$coverage_root"
          ./wheel-env/bin/robotsix-modules validate \
            --root "$coverage_root" \
            "$WORKSPACE/tests/cli/fixtures/valid_modules.yaml"
      - name: Dogfood — validate the real modules.yaml
        # Block scalar on purpose: a single-line `run: cmd \` YAML plain
        # scalar folds the continuation with a space, turning the `\` into
        # an escaped-space argument (the CLI then sees a leading-space path).
        run: |
          ./wheel-env/bin/robotsix-modules validate "$WORKSPACE/docs/modules.yaml"

  sbom:
    name: SBOM + audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    needs: [check]
    if: always()
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
        with:
          python-version: "3.14"
          sync-args: "--locked"
      - run: uv audit --output-format sarif > uv-audit.sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        if: always()
        with:
          sarif_file: uv-audit.sarif
          category: uv-audit
      - run: uv export --format cyclonedx1.5 --output-file sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

  security:
    permissions:
      contents: read
      security-events: write  # needed by bandit / audit SARIF uploads inside the reusable workflow
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@f6219bfc4b1d44b8d574a7ea022882a2edba1c6c  # main
